version: crypto_mechanism_templates_v1
# Roles are declared by field pools; all windows are 1h decision bars.
families:
  - name: downside_flow_absorption
    kind: time_series_formula
    order: 2
    target_modes: [downside_semivariance, total_variance]
    hypothesis_card: docs/cards/crypto_downside_flow_absorption.md
    fields_a: [micro5_taker_imbalance, micro5_imbalance_trend, micro5_15_flow_gap]
    fields_b: [micro5_jump_share, micro5_volume_hhi, micro5_path_efficiency]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168]
    forms:
      - Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore({B},{L}))
      - GateNeg(TsZScore({A},{L}),TsZScore(TsEMA({B},{S}),{L}))
      - TsZScore(TsCorr({A},{B},{L}),{L})
    max_count: 450
    max_depth: 9
    max_nodes: 20
    max_ts_ops: 5
    max_pair_ops: 1
    max_binary_ops: 2

  - name: upside_flow_confirmation
    kind: time_series_formula
    order: 2
    target_modes: [upside_semivariance, return]
    hypothesis_card: docs/cards/crypto_upside_flow_confirmation.md
    fields_a: [ret_1h, ret_4h, vwap_bias, session_cumulative_return]
    fields_b: [micro5_taker_imbalance, micro_imbalance_trend, session_flow_surprise]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168]
    forms:
      - Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore(TsEMA({B},{S}),{L}))
      - GatePos(TsZScore({B},{L}),TsZScore(TsEMA({A},{S}),{L}))
      - TsZScore(TsDelta(TsCorr({A},{B},{L}),{S}),{L})
    max_count: 500
    max_depth: 10
    max_nodes: 22
    max_ts_ops: 6
    max_pair_ops: 1
    max_binary_ops: 2

  - name: ny_session_transfer
    kind: time_series_formula
    order: 3
    target_modes: [downside_semivariance, upside_semivariance, total_variance]
    hypothesis_card: docs/cards/crypto_ny_session_transfer.md
    fields_a: [session_flow_surprise, session_volatility_surprise, session_illiquidity_surprise]
    fields_b: [micro5_jump_share, micro5_volume_hhi, micro5_taker_imbalance]
    fields_c: [us_day_flag, us_evening_flag, us_overnight_flag]
    short_windows: [3, 6]
    long_windows: [48, 96, 168]
    forms:
      - Mul({C},Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore({B},{L})))
      - Mul({C},GatePos(TsZScore({A},{L}),TsZScore(TsEMA({B},{S}),{L})))
    max_count: 550
    max_depth: 10
    max_nodes: 24
    max_ts_ops: 5
    max_pair_ops: 0
    max_binary_ops: 3

  - name: continuous_liquidity_stress
    kind: time_series_formula
    order: 3
    target_modes: [downside_semivariance, total_variance]
    hypothesis_card: docs/cards/crypto_continuous_liquidity_stress.md
    fields_a: [amihud_shock_24h, session_illiquidity_surprise]
    fields_b: [volume_shock_24h, trade_count_shock_24h]
    fields_c: [micro5_jump_share, micro5_volatility_ratio]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168]
    forms:
      - Mul(GatePos(TsZScore({A},{L}),TsZScore(TsEMA({B},{S}),{L})),TsZScore({C},{L}))
      - Div(Mul(TsZScore({A},{L}),TsZScore({C},{L})),Add(Abs(TsZScore({B},{L})),1))
    max_count: 450
    max_depth: 10
    max_nodes: 24
    max_ts_ops: 6
    max_pair_ops: 0
    max_binary_ops: 4

  - name: variance_persistence_baseline
    kind: time_series_formula
    order: 1
    target_modes: [upside_semivariance, downside_semivariance, total_variance]
    hypothesis_card: docs/cards/crypto_variance_clock_baselines.md
    fields_a: [micro5_realized_vol, micro5_upside_share, micro5_jump_share]
    short_windows: [3, 6]
    long_windows: [48, 96, 168]
    forms:
      - TsZScore({A},{L})
      - TsZScore(TsEMA({A},{S}),{L})
    max_count: 30
    max_depth: 5
    max_nodes: 9
    max_ts_ops: 2
    max_pair_ops: 0
    max_binary_ops: 0

  - name: joint_pressure_state
    kind: time_series_formula
    order: 2
    target_modes: [downside_semivariance, total_variance]
    hypothesis_card: docs/cards/crypto_flow_jump_liquidity_cluster.md
    fields_a: [cluster_stress_affinity]
    fields_b: [micro5_jump_share, session_flow_surprise]
    short_windows: [3, 6]
    long_windows: [48, 96, 168]
    forms:
      - TsZScore({A},{L})
      - TsZScore(TsDelta({A},{S}),{L})
      - Mul(TsZScore({A},{L}),TsZScore({B},{L}))
    max_count: 45
    max_depth: 6
    max_nodes: 12
    max_ts_ops: 3
    max_pair_ops: 0
    max_binary_ops: 1

  - name: ny_clock_baseline
    kind: time_series_formula
    order: 1
    target_modes: [upside_semivariance, downside_semivariance, total_variance]
    hypothesis_card: docs/cards/crypto_variance_clock_baselines.md
    fields_a: [us_day_flag, us_evening_flag, us_overnight_flag]
    short_windows: [3]
    long_windows: [48]
    forms:
      - "{A}"
    max_count: 3
    max_depth: 1
    max_nodes: 1
    max_ts_ops: 0
    max_pair_ops: 0
    max_binary_ops: 0
