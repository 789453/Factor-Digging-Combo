version: crypto_templates_v1

families:
  - name: crypto_single_state
    kind: single
    order: 1
    unary_pre: [Id, Abs, SLog1p]
    ts_ops: [TsMean, TsStd, TsIr, TsRank, TsDelta, TsDiv, TsPctChange, TsWMA, TsEMA, TsMinMaxDiff]
    outer_transforms: [Rank, SLog1p, RankSLog1p]
    max_count: 1400
    max_depth: 6
    max_nodes: 15
    max_ts_ops: 3
    max_pair_ops: 0
    max_binary_ops: 2

  - name: crypto_binary_same
    kind: binary_same
    order: 2
    ts_ops: [TsMean, TsStd, TsDelta, TsEMA, TsWMA, TsRank]
    binary_ops: [Add, Sub, Mul, Div, Greater, Less]
    outer_transforms: [Rank, SLog1p, RankSLog1p]
    max_count: 1400
    max_depth: 7
    max_nodes: 20
    max_ts_ops: 5
    max_pair_ops: 0
    max_binary_ops: 3

  - name: crypto_binary_mixed
    kind: binary_mixed
    order: 2
    left_ts_ops: [TsMean, TsEMA, TsDelta, TsIr, TsRank]
    right_ts_ops: [TsMean, TsStd, TsRank, TsWMA, TsEMA]
    binary_ops: [Sub, Div, Mul, Add]
    outer_transforms: [Rank, RankSLog1p]
    max_count: 1400
    max_depth: 7
    max_nodes: 20
    max_ts_ops: 4
    max_pair_ops: 0
    max_binary_ops: 3

  - name: crypto_rolling_relationship
    kind: pair_rolling
    order: 2
    pair_ops: [TsCorr, TsCov]
    outer_transforms: [Rank, SLog1p]
    max_count: 1200
    max_depth: 6
    max_nodes: 15
    max_ts_ops: 2
    max_pair_ops: 1
    max_binary_ops: 1

  - name: crypto_short_long_gap
    kind: multi_window
    order: 2
    short_windows: [4, 8, 12, 24]
    long_windows: [48, 72, 168, 336]
    ts_ops: [TsMean, TsStd, TsEMA, TsRank, TsIr]
    binary_ops: [Sub, Div]
    outer_transforms: [Rank, RankSLog1p]
    max_count: 1300
    max_depth: 7
    max_nodes: 20
    max_ts_ops: 4
    max_pair_ops: 0
    max_binary_ops: 3

  - name: crypto_cross_window_state
    kind: cross_window_binary
    order: 2
    short_windows: [4, 8, 12, 24]
    long_windows: [48, 72, 168, 336]
    left_ts_ops: [TsMean, TsDelta, TsRank, TsEMA]
    right_ts_ops: [TsMean, TsStd, TsEMA, TsRank]
    binary_ops: [Sub, Div, Mul, Add]
    outer_transforms: [Rank]
    max_count: 1400
    max_depth: 7
    max_nodes: 22
    max_ts_ops: 4
    max_pair_ops: 0
    max_binary_ops: 3

  - name: crypto_normalized_spread
    kind: normalized_binary
    order: 2
    ts_ops: [TsMean, TsEMA, TsDelta, TsRank]
    outer_transforms: [Rank]
    max_count: 1300
    max_depth: 8
    max_nodes: 26
    max_ts_ops: 5
    max_pair_ops: 0
    max_binary_ops: 5

  - name: crypto_relationship_change
    kind: pair_change
    order: 2
    short_windows: [4, 8, 12, 24]
    long_windows: [48, 72, 168, 336]
    pair_ops: [TsCorr]
    outer_transforms: [Rank, RankSLog1p]
    max_count: 1100
    max_depth: 7
    max_nodes: 18
    max_ts_ops: 3
    max_pair_ops: 1
    max_binary_ops: 1

  - name: crypto_triple_modulation
    kind: triple
    order: 3
    ts_ops: [TsMean, TsDelta, TsEMA, TsRank]
    forms:
      - Rank(Mul(Sub({A},{B}),{C}))
      - Rank(Div(Sub({A},{B}),Add(Abs({C}),Abs({B}))))
      - Rank(Sub(Mul({A},{B}),{C}))
      - Rank(Add(Mul({A},{B}),{C}))
      - Rank(Mul(Div({A},Add(Abs({B}),Abs({C}))),{C}))
    max_count: 1400
    max_depth: 8
    max_nodes: 28
    max_ts_ops: 5
    max_pair_ops: 0
    max_binary_ops: 5

  - name: crypto_quad_balanced
    kind: quad
    order: 4
    ts_ops: [TsMean, TsEMA, TsRank]
    forms:
      - Rank(Sub(Mul({A},{B}),Mul({C},{D})))
      - Rank(Sub(Div({A},Add(Abs({B}),Abs({C}))),Div({C},Add(Abs({D}),Abs({A})))))
      - Rank(Mul(Sub({A},{B}),Sub({C},{D})))
      - Rank(Add(Mul({A},{B}),Mul({C},{D})))
    max_count: 1200
    max_depth: 9
    max_nodes: 32
    max_ts_ops: 6
    max_pair_ops: 0
    max_binary_ops: 6
