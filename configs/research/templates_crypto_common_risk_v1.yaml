version: crypto_common_risk_mechanisms_v1
families:
  - name: beta_variance_path
    kind: time_series_formula
    order: 2
    target_modes: [downside_semivariance]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [realized_vol_4h, realized_vol_24h, downside_vol_24h, upside_vol_24h, micro5_realized_vol, micro5_volatility_ratio]
    fields_b: [micro5_upside_share, micro5_jump_share, micro5_volume_hhi, micro5_trade_hhi, volatility_direction_24h, return_skew_24h]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore({B},{L}))
      - TsZScore(TsDelta(TsCorr({A},{B},{L}),{S}),{L})
      - GatePos(TsZScore({B},{L}),TsZScore(TsEMA({A},{S}),{L}))
      - TsZScore(Sub(TsEMA({A},{S}),TsEMA({A},{L})),{L})
    max_count: 2500
    max_depth: 10
    max_nodes: 24
    max_ts_ops: 7
    max_pair_ops: 1
    max_binary_ops: 2
  - name: beta_liquidity_compression
    kind: time_series_formula
    order: 3
    target_modes: [downside_semivariance]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [amihud_shock_24h, session_illiquidity_surprise, liquidity_efficiency, micro5_volume_hhi, micro5_trade_hhi]
    fields_b: [volume_shock_24h, trade_count_shock_24h, avg_trade_size_shock_24h, session_volume_surprise, micro5_volume_trend]
    fields_c: [micro5_jump_share, micro5_upside_share, downside_vol_24h, micro5_realized_vol, volatility_term_slope]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - Mul(GatePos(TsZScore({A},{L}),TsZScore(TsEMA({B},{S}),{L})),TsZScore({C},{L}))
      - Div(Mul(TsZScore({A},{L}),TsZScore({C},{L})),Add(Abs(TsZScore({B},{L})),1))
      - Mul(TsZScore(TsDelta({A},{S}),{L}),TsZScore(TsCorr({B},{C},{L}),{L}))
    max_count: 2500
    max_depth: 11
    max_nodes: 27
    max_ts_ops: 7
    max_pair_ops: 1
    max_binary_ops: 4
  - name: beta_ny_transfer
    kind: time_series_formula
    order: 3
    target_modes: [downside_semivariance]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [session_volatility_surprise, session_illiquidity_surprise, session_volume_surprise, session_flow_surprise, micro5_15_jump_gap]
    fields_b: [micro5_jump_share, micro5_volume_hhi, micro5_trade_hhi, taker_imbalance, micro5_imbalance_trend]
    fields_c: [us_day_flag, us_evening_flag, us_overnight_flag, ny_hour_sin]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - Mul({C},Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore({B},{L})))
      - Mul({C},GatePos(TsZScore({A},{L}),TsZScore(TsDelta({B},{S}),{L})))
      - Mul({C},TsZScore(TsDelta(TsCorr({A},{B},{L}),{S}),{L}))
    max_count: 2500
    max_depth: 11
    max_nodes: 26
    max_ts_ops: 7
    max_pair_ops: 1
    max_binary_ops: 3
  - name: beta_flow_jump_pressure
    kind: time_series_formula
    order: 2
    target_modes: [downside_semivariance]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [taker_imbalance, micro5_taker_imbalance, micro5_15_flow_gap, session_flow_surprise, micro5_imbalance_trend, taker_imbalance_change_4h]
    fields_b: [micro5_jump_share, micro5_volume_hhi, micro5_trade_hhi, session_illiquidity_surprise, downside_vol_24h, micro5_realized_vol]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - GateNeg(TsZScore({A},{L}),TsZScore(TsEMA({B},{S}),{L}))
      - Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore({B},{L}))
      - TsZScore(TsCorr({A},{B},{L}),{L})
      - TsZScore(TsDelta(TsCorr({A},{B},{L}),{S}),{L})
    max_count: 2500
    max_depth: 10
    max_nodes: 23
    max_ts_ops: 7
    max_pair_ops: 1
    max_binary_ops: 2
  - name: beta_market_state_baselines
    kind: time_series_formula
    order: 1
    target_modes: [downside_semivariance]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [realized_vol_4h, realized_vol_24h, downside_vol_24h, micro5_realized_vol, micro5_jump_share, micro5_upside_share, volume_shock_24h, us_day_flag, us_evening_flag]
    short_windows: [3, 6, 12, 24]
    long_windows: [48, 96, 168, 336]
    forms:
      - TsZScore({A},{L})
      - TsZScore(TsEMA({A},{S}),{L})
      - TsZScore(TsDelta({A},{S}),{L})
    max_count: 1200
    max_depth: 6
    max_nodes: 10
    max_ts_ops: 3
    max_pair_ops: 0
    max_binary_ops: 0
  - name: beta_state_transition
    kind: time_series_formula
    order: 3
    target_modes: [downside_semivariance]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [micro5_jump_share, micro5_upside_share, volatility_direction_24h, micro5_volatility_ratio, return_skew_24h]
    fields_b: [session_illiquidity_surprise, amihud_shock_24h, micro5_volume_hhi, trade_count_shock_24h, volume_shock_24h]
    fields_c: [taker_imbalance, micro5_taker_imbalance, session_flow_surprise, micro5_imbalance_trend, ret_1h]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - Mul(TsZScore(TsDelta({A},{S}),{L}),TsZScore(TsCorr({B},{C},{L}),{L}))
      - GateNeg(TsZScore({C},{L}),Mul(TsZScore({A},{L}),TsZScore({B},{L})))
      - Div(Mul(TsZScore({A},{L}),TsZScore({B},{L})),Add(Abs(TsZScore({C},{L})),1))
    max_count: 2500
    max_depth: 11
    max_nodes: 27
    max_ts_ops: 7
    max_pair_ops: 1
    max_binary_ops: 4
