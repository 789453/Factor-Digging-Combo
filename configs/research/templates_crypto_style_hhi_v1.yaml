version: crypto_style_hhi_mechanisms_v1
families:
  - name: hhi_persistence_transition
    kind: time_series_formula
    order: 2
    target_modes: [liquidity_concentration]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [micro5_volume_hhi, micro5_trade_hhi, micro5_volume_trend, session_volume_surprise]
    fields_b: [volume_shock_24h, trade_count_shock_24h, avg_trade_size_shock_24h, micro5_jump_share, liquidity_efficiency]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore({B},{L}))
      - TsZScore(TsDelta(TsCorr({A},{B},{L}),{S}),{L})
      - GatePos(TsZScore({A},{L}),TsZScore(TsEMA({B},{S}),{L}))
      - Div(TsZScore({A},{L}),Add(Abs(TsZScore({B},{L})),1))
      - Mul(TsZScore(TsDelta({A},{S}),{L}),TsZScore({B},{L}))
      - GateNeg(TsZScore({B},{L}),TsZScore(TsEMA({A},{S}),{L}))
      - TsZScore(TsCorr({A},{B},{L}),{L})
    max_count: 2200
    max_depth: 11
    max_nodes: 27
    max_ts_ops: 8
    max_pair_ops: 1
    max_binary_ops: 3
  - name: hhi_flow_fragmentation
    kind: time_series_formula
    order: 3
    target_modes: [liquidity_concentration]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [taker_imbalance_change_4h, taker_imbalance_mean_4h, micro5_15_flow_gap, micro5_imbalance_trend, session_flow_surprise]
    fields_b: [micro5_volume_hhi, micro5_trade_hhi, volume_shock_24h, trade_count_shock_24h]
    fields_c: [micro5_jump_share, amihud_shock_24h, micro5_realized_vol, realized_vol_4h]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - Mul(GatePos(TsZScore({A},{L}),TsZScore({B},{L})),TsZScore({C},{L}))
      - Div(Mul(TsZScore({A},{L}),TsZScore({B},{L})),Add(Abs(TsZScore({C},{L})),1))
      - Mul(TsZScore(TsDelta({A},{S}),{L}),TsZScore(TsCorr({B},{C},{L}),{L}))
      - GateNeg(TsZScore({A},{L}),Mul(TsZScore({B},{L}),TsZScore({C},{L})))
    max_count: 2200
    max_depth: 11
    max_nodes: 28
    max_ts_ops: 8
    max_pair_ops: 1
    max_binary_ops: 4
  - name: hhi_price_impact_coupling
    kind: time_series_formula
    order: 3
    target_modes: [liquidity_concentration]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [ret_1h, realized_vol_4h, downside_vol_24h, micro5_jump_share, micro5_upside_share]
    fields_b: [amihud_shock_24h, session_illiquidity_surprise, liquidity_efficiency, micro5_volatility_ratio]
    fields_c: [micro5_volume_hhi, micro5_trade_hhi, volume_shock_24h, avg_trade_size_shock_24h]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - Mul(TsZScore(TsEMA({A},{S}),{L}),Mul(TsZScore({B},{L}),TsZScore({C},{L})))
      - GateNeg(TsZScore(TsCorr({A},{B},{L}),{L}),TsZScore({C},{L}))
      - Div(Mul(TsZScore({A},{L}),TsZScore({B},{L})),Add(Abs(TsZScore({C},{L})),1))
      - Mul(TsZScore(TsDelta({B},{S}),{L}),TsZScore(TsCorr({A},{C},{L}),{L}))
    max_count: 2200
    max_depth: 12
    max_nodes: 29
    max_ts_ops: 8
    max_pair_ops: 1
    max_binary_ops: 4
  - name: hhi_ny_clock_transfer
    kind: time_series_formula
    order: 3
    target_modes: [liquidity_concentration]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [session_volume_surprise, session_flow_surprise, session_illiquidity_surprise, micro5_volume_trend]
    fields_b: [micro5_volume_hhi, micro5_trade_hhi, trade_count_shock_24h, micro5_jump_share]
    fields_c: [us_day_flag, us_evening_flag, us_overnight_flag, ny_hour_sin]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - Mul({C},Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore({B},{L})))
      - Mul({C},GatePos(TsZScore({A},{L}),TsZScore(TsDelta({B},{S}),{L})))
      - Mul({C},TsZScore(TsDelta(TsCorr({A},{B},{L}),{S}),{L}))
    max_count: 2200
    max_depth: 11
    max_nodes: 27
    max_ts_ops: 8
    max_pair_ops: 1
    max_binary_ops: 4
  - name: hhi_activity_divergence
    kind: time_series_formula
    order: 3
    target_modes: [liquidity_concentration]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [volume_shock_24h, trade_count_shock_24h, avg_trade_size_shock_24h, micro5_volume_trend]
    fields_b: [micro5_volume_hhi, micro5_trade_hhi, session_volume_surprise, liquidity_efficiency]
    fields_c: [taker_imbalance_change_4h, micro5_imbalance_trend, amihud_shock_24h, micro5_jump_share]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - Mul(TsZScore(Sub(TsEMA({A},{S}),TsEMA({B},{S})),{L}),TsZScore({C},{L}))
      - GatePos(TsZScore(TsDelta({A},{S}),{L}),Mul(TsZScore({B},{L}),TsZScore({C},{L})))
      - TsZScore(TsDelta(TsCorr({A},{B},{L}),{S}),{L})
      - Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore(TsCorr({B},{C},{L}),{L}))
    max_count: 2200
    max_depth: 12
    max_nodes: 29
    max_ts_ops: 8
    max_pair_ops: 1
    max_binary_ops: 4
  - name: hhi_simple_controls
    kind: time_series_formula
    order: 1
    target_modes: [liquidity_concentration]
    hypothesis_card: docs/cards/crypto_purpose_search_hypotheses.md
    fields_a: [micro5_volume_hhi, micro5_trade_hhi, volume_shock_24h, trade_count_shock_24h, avg_trade_size_shock_24h, us_day_flag, us_evening_flag]
    short_windows: [3, 6, 12]
    long_windows: [48, 96, 168, 336]
    forms:
      - TsZScore({A},{L})
      - TsZScore(TsEMA({A},{S}),{L})
      - TsZScore(TsDelta({A},{S}),{L})
    max_count: 900
    max_depth: 6
    max_nodes: 10
    max_ts_ops: 3
    max_pair_ops: 0
    max_binary_ops: 0
