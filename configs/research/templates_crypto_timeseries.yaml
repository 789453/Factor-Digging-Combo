version: crypto_time_series_templates_v1

# All formulas are per-asset time-series signals. No cross-sectional Rank is
# embedded in the expression. S/L denote fast and regime windows.
families:
  - name: ts_level_and_smoothing
    kind: time_series_formula
    order: 1
    short_windows: [4, 12, 24]
    long_windows: [72, 168, 336]
    fields_a: [ret_1h, ret_4h, ret_24h, oc_ret, vwap_bias, taker_imbalance, taker_imbalance_mean_24h, volume_shock_24h, trade_count_shock_24h, volatility_term_slope, micro_return_reversal, micro_volume_trend, micro_imbalance_trend]
    forms:
      - TsZScore({A},{L})
      - TsZScore(TsEMA({A},{S}),{L})
      - TsZScore(TsWMA({A},{S}),{L})
      - TsIr({A},{L})
    max_count: 1400
    max_depth: 6
    max_nodes: 12
    max_ts_ops: 3
    max_pair_ops: 0
    max_binary_ops: 1

  - name: ts_first_second_derivative
    kind: time_series_formula
    order: 1
    short_windows: [4, 12, 24]
    long_windows: [72, 168, 336]
    fields_a: [ret_1h, ret_4h, ret_24h, hl_range, vwap_bias, realized_vol_24h, volatility_term_slope, volume_shock_24h, trade_count_shock_24h, avg_trade_size_shock_24h, taker_imbalance, taker_imbalance_mean_24h, micro_volume_trend, micro_imbalance_trend, micro_range_expansion]
    forms:
      - TsZScore(TsDelta({A},{S}),{L})
      - TsZScore(TsDelta(TsDelta({A},{S}),{S}),{L})
      - TsZScore(TsDelta(TsEMA({A},{S}),{S}),{L})
      - TsZScore(Sub(TsEMA({A},{S}),TsEMA({A},{L})),{L})
    max_count: 1400
    max_depth: 8
    max_nodes: 18
    max_ts_ops: 5
    max_pair_ops: 0
    max_binary_ops: 2

  - name: ts_price_volume_confirmation
    kind: time_series_formula
    order: 2
    short_windows: [4, 12, 24]
    long_windows: [72, 168, 336]
    fields_a: [ret_1h, ret_4h, ret_24h, oc_ret, vwap_bias, short_long_momentum_gap, micro_last_return, micro_return_reversal]
    fields_b: [volume_shock_24h, volume_ratio_24h, trade_count_shock_24h, avg_trade_size_shock_24h, micro_volume_trend, micro_trade_concentration]
    forms:
      - Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore(TsEMA({B},{S}),{L}))
      - GatePos(TsZScore({B},{L}),TsZScore(TsDelta({A},{S}),{L}))
      - GateNeg(TsZScore({B},{L}),TsZScore(TsDelta({A},{S}),{L}))
      - TsZScore(TsCorr({A},{B},{L}),{L})
    max_count: 1500
    max_depth: 8
    max_nodes: 20
    max_ts_ops: 5
    max_pair_ops: 1
    max_binary_ops: 2

  - name: ts_price_flow_confirmation
    kind: time_series_formula
    order: 2
    short_windows: [4, 12, 24]
    long_windows: [72, 168, 336]
    fields_a: [ret_1h, ret_4h, ret_24h, oc_ret, vwap_bias, short_long_momentum_gap, micro_last_return, micro_return_reversal]
    fields_b: [taker_imbalance, taker_imbalance_change_4h, taker_imbalance_mean_4h, taker_imbalance_mean_24h, micro_taker_imbalance, micro_imbalance_trend, taker_micro_divergence]
    forms:
      - Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore(TsEMA({B},{S}),{L}))
      - Sub(TsZScore(TsEMA({B},{S}),{L}),TsZScore(TsEMA({A},{S}),{L}))
      - GatePos(TsZScore({B},{L}),TsZScore(TsDelta({A},{S}),{L}))
      - TsZScore(TsCorr({A},{B},{L}),{L})
    max_count: 1500
    max_depth: 8
    max_nodes: 20
    max_ts_ops: 5
    max_pair_ops: 1
    max_binary_ops: 2

  - name: ts_risk_regime_gate
    kind: time_series_formula
    order: 2
    short_windows: [4, 12, 24]
    long_windows: [72, 168, 336]
    fields_a: [ret_1h, ret_4h, ret_24h, short_long_momentum_gap, taker_imbalance, taker_imbalance_mean_24h, micro_return_reversal, micro_imbalance_trend]
    fields_b: [realized_vol_4h, realized_vol_24h, downside_vol_24h, volatility_term_slope, micro_volatility_ratio, micro_range_expansion, amihud_shock_24h]
    forms:
      - GatePos(TsZScore({B},{L}),TsZScore(TsEMA({A},{S}),{L}))
      - GateNeg(TsZScore({B},{L}),TsZScore(TsEMA({A},{S}),{L}))
      - Div(TsZScore(TsEMA({A},{S}),{L}),Add(Abs(TsZScore({B},{L})),1))
      - Mul(Sign(TsZScore({B},{L})),TsZScore(TsDelta({A},{S}),{L}))
    max_count: 1400
    max_depth: 9
    max_nodes: 22
    max_ts_ops: 5
    max_pair_ops: 0
    max_binary_ops: 3

  - name: ts_liquidity_flow_state
    kind: time_series_formula
    order: 2
    short_windows: [4, 12, 24]
    long_windows: [72, 168, 336]
    fields_a: [taker_imbalance, taker_imbalance_mean_24h, micro_taker_imbalance, micro_imbalance_trend, taker_micro_divergence]
    fields_b: [volume_shock_24h, volume_ratio_24h, trade_count_shock_24h, avg_trade_size_shock_24h, amihud_shock_24h, micro_volume_concentration, micro_trade_concentration]
    forms:
      - Mul(TsZScore(TsEMA({A},{S}),{L}),TsZScore({B},{L}))
      - GatePos(TsZScore({B},{L}),TsZScore(TsDelta({A},{S}),{L}))
      - TsZScore(TsCorr({A},{B},{L}),{L})
      - TsZScore(TsDelta(TsCorr({A},{B},{L}),{S}),{L})
    max_count: 1400
    max_depth: 9
    max_nodes: 22
    max_ts_ops: 5
    max_pair_ops: 1
    max_binary_ops: 2

  - name: ts_correlation_dynamics
    kind: time_series_formula
    order: 2
    short_windows: [4, 12, 24]
    long_windows: [72, 168, 336]
    fields_a: [ret_1h, ret_4h, ret_24h, realized_vol_24h, volume_shock_24h, taker_imbalance, micro_realized_vol, micro_volume_trend]
    fields_b: [hl_range, downside_vol_24h, volume_ratio_24h, trade_count_shock_24h, taker_imbalance_mean_24h, micro_taker_imbalance, micro_range_expansion]
    forms:
      - TsZScore(TsCorr({A},{B},{L}),{L})
      - TsZScore(TsDelta(TsCorr({A},{B},{L}),{S}),{L})
      - TsZScore(Sub(TsCorr({A},{B},{S}),TsCorr({A},{B},{L})),{L})
      - GatePos(TsZScore(TsCorr({A},{B},{L}),{L}),TsZScore(TsDelta({A},{S}),{L}))
    max_count: 1500
    max_depth: 9
    max_nodes: 22
    max_ts_ops: 5
    max_pair_ops: 2
    max_binary_ops: 2

  - name: ts_micro_macro_transition
    kind: time_series_formula
    order: 2
    short_windows: [4, 12, 24]
    long_windows: [72, 168, 336]
    fields_a: [micro_last_return, micro_return_reversal, micro_realized_vol, micro_path_efficiency, micro_volume_trend, micro_imbalance_trend, micro_range_expansion, micro_vwap_dispersion]
    fields_b: [ret_4h, ret_24h, realized_vol_24h, trend_efficiency_24h, volume_shock_24h, taker_imbalance_mean_24h, vwap_bias]
    forms:
      - Sub(TsZScore(TsEMA({A},{S}),{L}),TsZScore(TsEMA({B},{S}),{L}))
      - Mul(TsZScore({A},{L}),TsZScore({B},{L}))
      - TsZScore(TsCorr({A},{B},{L}),{L})
      - GatePos(TsZScore({B},{L}),TsZScore(TsDelta({A},{S}),{L}))
    max_count: 1400
    max_depth: 8
    max_nodes: 20
    max_ts_ops: 5
    max_pair_ops: 1
    max_binary_ops: 2
